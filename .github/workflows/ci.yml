name: CI

on:
  push:
  pull_request:

# N-12 (2026-09-07 security-review re-verification): least-privilege
# default for the GITHUB_TOKEN this workflow's steps run with — none of
# these steps need to write anything back to the repository (checkout,
# Dart setup, dependency cache, analyze, test). An unpinned/overly broad
# default token scope is a bigger blast radius than a straight read-only
# CI run needs.
permissions:
  contents: read

jobs:
  test:
    # macos-latest, not the usual ubuntu default: the ObjectBox native
    # library this project ships (lib/libobjectbox.dylib) is macOS-only in
    # this project's release today, and several tests spawn real
    # subprocesses (multi-process gated-mode acceptance, instance-guard
    # locking) that need a real, writable filesystem with POSIX advisory
    # locks — see CLAUDE.md and docs/architecture.md.
    runs-on: macos-latest

    steps:
      # N-12 (2026-09-07 security-review re-verification): pinned to full
      # commit SHAs, not floating tags — a tag can be force-moved or
      # deleted by anyone with push access to the action's repo, a commit
      # SHA cannot. Resolved via `git ls-remote --tags
      # https://github.com/<owner>/<repo>` against the highest matching
      # version tag at the time; re-resolve the same way when bumping.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          # The "3.x" wildcard makes setup-dart fail before it downloads
          # anything (TypeError on its version listing); the stable channel
          # resolves to the current 3.x release, which satisfies ^3.10.0.
          sdk: stable

      - name: Cache pub packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup (deps + ObjectBox C library + codegen)
        # Needs network: downloads the ObjectBox native library via
        # tool/setup.sh's commit-SHA-pinned, checksum-verified fetch (M-7,
        # 2026-09-07 security review) and runs build_runner.
        run: tool/setup.sh

      - name: Analyze
        # Must stay clean — see CLAUDE.md's ground rules. Plain `dart
        # analyze`, not --fatal-infos: this repo does not currently commit
        # to a zero-infos bar, only a zero-warnings/errors one.
        run: dart analyze

      - name: Test
        # The Ollama integration test (test/ollama_integration_test.dart) is
        # tagged `ollama` and skipped by default (dart_test.yaml) — it needs
        # a real local Ollama instance, which this runner does not have.
        # Only `dart test -P ollama` would opt it in; we deliberately do not
        # pass that here.
        run: dart test
